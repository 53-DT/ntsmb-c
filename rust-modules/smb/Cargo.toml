[package]
name = "plx_smb"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Direct SMB2/3 access for the native webOS media browser."
publish = false

[lib]
name = "plx_smb"
crate-type = ["rlib"]

[features]
default = []
playback = ["dep:plx_play_feed", "dep:plx_playback_contract"]

[dependencies]
plx_os = { path = "../os" }
plx_play_feed = { path = "../play-feed", optional = true }
plx_playback_contract = { path = "../playback-contract", optional = true }
smb2 = { version = "=0.26.0", default-features = false, features = ["smol"] }
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"

[lints]
workspace = true
